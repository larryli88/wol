[server]
# Only cloudflared on the same host should reach this. Do not bind 0.0.0.0.
host = "127.0.0.1"
port = 8099

[monitor]
# Seconds between status checks.
interval = 15

[access]
# Your Zero Trust team domain, and the Access application's
# "Application Audience (AUD) Tag" (shown on the application's overview page).
team_domain = "https://<team-name>.cloudflareaccess.com"
aud = "<application-aud-tag>"

[[devices]]
name = "Desktop"
mac = "00:11:22:33:44:55"
ip = "192.168.1.100"
broadcast = "192.168.1.255"
# Fallback when the PC's firewall drops ping: a TCP connect that is accepted
# or refused also counts as online (445 = SMB, 3389 = RDP).
probe_ports = [445, 3389]

# Optional: remote shutdown over SSH (adds a 关机 button). Put the private key
# in secrets/id_shutdown and the device's host key in secrets/known_hosts.
# On the device, pin the key to the command in authorized_keys:
#   restrict,command="shutdown /s /t 0" ssh-ed25519 AAAA...
[devices.shutdown]
user = "your-windows-user"
# command = "shutdown /s /t 0"

# A virtual machine on this host. There is no magic packet for a VM, so both
# buttons run virsh on the hypervisor over SSH (host = the hypervisor, here
# the same machine this service runs on). One key per command, each pinned in
# ~/.ssh/authorized_keys on the host:
#   restrict,from="127.0.0.1",command="virsh -c qemu:///system start myvm" ssh-ed25519 AAAA...
#   restrict,from="127.0.0.1",command="virsh -c qemu:///system shutdown myvm" ssh-ed25519 AAAA...
[[devices]]
name = "My VM"
note = "KVM 虚拟机"
ip = "192.168.122.10"
probe_ports = [22]

[devices.wake]
host = "127.0.0.1"
user = "your-host-user"
key = "secrets/id_vm_start"
command = "virsh -c qemu:///system start myvm"

[devices.shutdown]
host = "127.0.0.1"
user = "your-host-user"
key = "secrets/id_vm_shutdown"
command = "virsh -c qemu:///system shutdown myvm"
